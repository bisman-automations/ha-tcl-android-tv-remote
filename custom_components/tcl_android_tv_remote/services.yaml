refresh_hdmi:
  name: Refresh HDMI sources
  description: >-
    Reconnect ADB if needed and rediscover HDMI inputs on the TV. Saved inputs
    the TV no longer reports are dropped, and an input you removed is added
    back when the TV still reports it.
  target:
    entity:
      integration: tcl_android_tv_remote
      domain: media_player

rebuild_sources:
  name: Rebuild sources
  description: >-
    Forget every saved HDMI input and every custom name stored on the TV, then
    discover inputs again. The names are deleted only after they are read; if
    the TV cannot be read, they are left unchanged. Use this after moving HDMI
    cables, when the source list still shows the old ports or names.
  target:
    entity:
      integration: tcl_android_tv_remote
      domain: media_player

remove_hdmi_inputs:
  name: Remove HDMI inputs
  description: >-
    Remove saved HDMI inputs by id or name. The custom names are read from
    the TV first, and only the names of these inputs are deleted; a name
    changed on the TV since the last refresh is kept. If the TV cannot be
    read, every name is left as it is. The inputs leave the source list
    immediately. Refresh HDMI adds back any input the TV still reports.
  target:
    entity:
      integration: tcl_android_tv_remote
      domain: media_player
  fields:
    inputs:
      name: Inputs
      description: >-
        Input ids or names to remove. A name is the label on the source list
        (Apple TV), a port (HDMI 2) or the id
        (com.tcl.tvinput/.TvPassThroughService/HW15).
      required: true
      example: HDMI 2
      selector:
        text:
          multiple: true

adb_command:
  name: Run ADB command
  description: >-
    Run a shell command on the TV over ADB and return its output (admin only,
    advanced). Requires ADB enabled.
  target:
    entity:
      integration: tcl_android_tv_remote
      domain: media_player
  fields:
    command:
      name: Command
      description: Shell command to run (without the "adb shell" prefix).
      required: true
      example: dumpsys tv_input
      selector:
        text:

adb_pair:
  name: ADB wireless pair
  description: >-
    Pair with the TV using Android 11+ Wireless debugging (pairing port + code
    from the TV screen), then switch the integration to Wireless debugging and
    reload it. Admin only.
  target:
    entity:
      integration: tcl_android_tv_remote
      domain: media_player
  fields:
    pairing_port:
      name: Pairing port
      description: Port shown next to the pairing code on the TV (e.g. 38525).
      required: true
      selector:
        number:
          min: 1024
          max: 65535
          mode: box
    pairing_code:
      name: Pairing code
      description: 6-digit code shown on the TV.
      required: true
      selector:
        text:
